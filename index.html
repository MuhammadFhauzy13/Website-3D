<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCODE</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- BACKGROUND -->
    <img class="img-gradient" src="gradient.png" alt="gradient" />
    <div class="layer-blur"></div>

    <div class="container">
      <!-- HEADER -->
      <header>
        <h1 class="logo">MCODE</h1>

        <nav>
          <a href="#">COMPANY</a>
          <a href="#">FEATURES</a>
          <a href="#">RESOURCES</a>
          <a href="#">DOCS</a>
        </nav>

        <button class="btn-signing">SIGNIN</button>
      </header>

      <!-- HERO SECTION -->
      <main>
        <!-- LEFT TEXT -->
        <div class="hero">
          <div class="content">
            <div class="tag-box">
              <div class="tag">INTRODUCING &wedbar;</div>
            </div>

            <h1>
              EMAIL FOR <br />
              DEVELOPER
            </h1>

            <p class="description">The best way to reach humans instead of spam folders, delivers transactional and marketing email at scale.</p>

            <div class="buttons">
              <a href="#" class="btn-get-started">Documentation &gt;</a>
              <a href="#" class="btn-signing-main">Get Started &gt;</a>
            </div>
          </div>
        </div>

        <!-- ROBOT 3D -->
        <div class="robot-wrapper">
          <spline-viewer class="robot-3d" url="https://prod.spline.design/UgyNLZa3hlwp9zZd/scene.splinecode"> </spline-viewer>
        </div>
      </main>
    </div>

    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.11.6/build/spline-viewer.js"></script>
  </body>
</html>
